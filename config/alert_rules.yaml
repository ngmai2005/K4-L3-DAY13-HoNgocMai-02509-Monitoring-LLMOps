alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-<MSSV>
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: request_failed / request_received > 2%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-<MSSV>
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: tool_success == true / tool_success != null < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-<MSSV>
    runbook: docs/alerts.md#alert-3
